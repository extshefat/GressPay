name: Verify

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web:
    name: Next.js tsc + live build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci || npm install
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_DATA_SOURCE: live

  php:
    name: PHP unit tests
    runs-on: ubuntu-latest
    container:
      image: php:8.2-cli-alpine
    steps:
      - uses: actions/checkout@v4
      - name: Install extensions
        run: |
          apk add --no-cache $PHPIZE_DEPS icu-dev curl-dev
          docker-php-ext-install bcmath
      - name: Run tests
        run: php backend/tests/run.php

  android:
    name: Android unit tests + APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GressPay-App-Project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Unit tests
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest --tests com.gresspay.companion.sms.PaymentSmsParserTest --stacktrace
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Upload companion APK
        uses: actions/upload-artifact@v4
        with:
          name: gresspay-companion-debug
          path: GressPay-App-Project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
