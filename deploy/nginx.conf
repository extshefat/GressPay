# One subdomain: Next.js UI + PHP API (Docker: web:3000, php:8080 built-in server)
# Replace server_name, then: certbot --nginx -d your-subdomain.example
#
# Matches backend/Dockerfile: `php -S 0.0.0.0:8080 -t public public/index.php`
# Do NOT use FastCGI/php-fpm here unless you change the API container.

upstream gresspay_web {
    server web:3000;
}

upstream gresspay_api {
    server php:8080;
}

server {
    listen 80;
    server_name your-subdomain.example;
    client_max_body_size 8m;

    location /api/ {
        proxy_pass http://gresspay_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://gresspay_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
