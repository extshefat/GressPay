name: Verify

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  postgres:
    name: PostgreSQL reconciliation
    runs-on: ubuntu-latest
    container: php:8.2-cli-alpine
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gresspay_test
          POSTGRES_USER: gresspay
          POSTGRES_PASSWORD: ci-only-test-password
        options: >-
          --health-cmd "pg_isready -U gresspay -d gresspay_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_ENV: development
      DB_DRIVER: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: gresspay_test
      DB_USER: gresspay
      DB_PASS: ci-only-test-password
      JWT_SECRET: ci-test-jwt-secret-at-least-32-characters
      APP_ENCRYPTION_KEY: ci-test-encryption-key-at-least-32-characters
      GRESSPAY_SMS_AUTO_ALLOWED: '0'
    steps:
      - uses: actions/checkout@v4
      - run: apk add --no-cache postgresql-dev $PHPIZE_DEPS && docker-php-ext-install pdo_pgsql bcmath
      - run: php backend/tests/postgres.php

  web:
    name: Next.js tsc + live build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Compose variants match
        run: cmp docker-compose.yml docker-compose.yaml
      - name: Check for merge conflict markers
        run: |
          if grep -rnE '<<<<<<< |>>>>>>> ' src/ backend/ --include='*.php' --include='*.ts' --include='*.tsx'; then
            echo "ERROR: Merge conflict markers found"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_DATA_SOURCE: live
      - name: Capture checkout preview on desktop and mobile
        run: |
          npm run start > /tmp/gresspay-preview.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://localhost:3000/checkout-preview > /dev/null && break || sleep 1; done
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=5000 --screenshot=checkout-desktop.png --window-size=1440,1100 http://localhost:3000/checkout-preview
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=5000 --screenshot=checkout-mobile.png --window-size=390,1000 http://localhost:3000/checkout-preview
      - uses: actions/upload-artifact@v4
        with:
          name: checkout-previews
          path: checkout-*.png

  php:
    name: PHP unit tests
    runs-on: ubuntu-latest
    container:
      image: php:8.2-cli-alpine
    steps:
      - uses: actions/checkout@v4
      - name: Check for merge conflict markers
        run: |
          if grep -rnE '<<<<<<< |>>>>>>> ' src/ backend/ --include='*.php' --include='*.ts' --include='*.tsx'; then
            echo "ERROR: Merge conflict markers found"
            exit 1
          fi
      - name: Install extensions
        run: |
          apk add --no-cache $PHPIZE_DEPS icu-dev curl-dev libpng-dev libjpeg-turbo-dev libwebp-dev
          docker-php-ext-configure gd --with-jpeg --with-webp
          docker-php-ext-install bcmath gd
      - name: Run tests
        run: |
          find backend -name '*.php' -print0 | xargs -0 -n1 php -l
          php backend/tests/run.php

  android:
    name: Android unit tests + APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GressPay-App-Project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$HOME/android-sdk}"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          SM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Rename debug APK
        run: |
          set -euo pipefail
          OUT="app/build/outputs/apk/debug"
          SRC="$(ls "$OUT"/*.apk | head -n1)"
          cp "$SRC" "$OUT/gresspay-debug.apk"
      - name: Upload GressPay debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gresspay-debug
          path: GressPay-App-Project/app/build/outputs/apk/debug/gresspay-debug.apk
          if-no-files-found: warn
      - name: Assemble release (when keystore secrets present)
        env:
          GRESSPAY_RELEASE_KEYSTORE_BASE64: ${{ secrets.GRESSPAY_RELEASE_KEYSTORE_BASE64 }}
          GRESSPAY_RELEASE_STORE_PASSWORD: ${{ secrets.GRESSPAY_RELEASE_STORE_PASSWORD }}
          GRESSPAY_RELEASE_KEY_ALIAS: ${{ secrets.GRESSPAY_RELEASE_KEY_ALIAS }}
          GRESSPAY_RELEASE_KEY_PASSWORD: ${{ secrets.GRESSPAY_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${GRESSPAY_RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "No GRESSPAY_RELEASE_KEYSTORE_BASE64 secret — skipping release APK (debug artifact still uploaded)."
            echo "Set keystore + password secrets to publish a release-signed gresspay.apk with R8."
            exit 0
          fi
          echo "$GRESSPAY_RELEASE_KEYSTORE_BASE64" | base64 -d > /tmp/gresspay-release.jks
          export GRESSPAY_RELEASE_KEYSTORE=/tmp/gresspay-release.jks
          ./gradlew :app:assembleRelease --stacktrace
          OUT="app/build/outputs/apk/release"
          SRC="$(ls "$OUT"/*.apk | head -n1)"
          cp "$SRC" "$OUT/gresspay.apk"
          mkdir -p ../public/download
          cp "$OUT/gresspay.apk" ../public/download/gresspay.apk
          SHA="$(sha256sum "$OUT/gresspay.apk" | awk '{print tolower($1)}')"
          SIZE="$(stat -c%s "$OUT/gresspay.apk")"
          echo "Release APK SHA-256=$SHA size=$SIZE"
          echo "Update src/lib/marketing/companion-download.ts version/sha/size to match this artifact before shipping."
      - name: Upload GressPay release APK
        uses: actions/upload-artifact@v4
        with:
          name: gresspay-release
          path: GressPay-App-Project/app/build/outputs/apk/release/gresspay.apk
          if-no-files-found: ignore
