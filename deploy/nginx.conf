# One subdomain: Next.js UI + PHP /api/v1
# Replace server_name, then: certbot --nginx -d your-subdomain.example

upstream gresspay_web {
    server web:3000;
}

server {
    listen 80;
    server_name your-subdomain.example;
    client_max_body_size 8m;

    location /api/ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/gresspay-api/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_read_timeout 60s;
    }

    location / {
        proxy_pass http://gresspay_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
