# In-container nginx: HTTP :LISTEN_PORT → FastCGI php-fpm :9000
# LISTEN_PORT is substituted by docker-entrypoint.sh from $PORT (default 8080).

server {
    listen LISTEN_PORT;
    server_name _;

    root /var/www/gresspay-api/public;
    index index.php;

    client_max_body_size 8m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\. {
        deny all;
    }
}
