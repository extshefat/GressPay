# VPS deploy for GressPay-API. Secrets MUST come from the host environment — no weak defaults.
# Required: JWT_SECRET, APP_ENCRYPTION_KEY, DB_PASS, MYSQL_ROOT_PASSWORD (each ≥32 chars recommended).
services:
  php:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_NAME: GressPay
      APP_ENV: production
      PORT: "8080"
      DB_DRIVER: ${DB_DRIVER:-mysql}
      DB_HOST: ${DB_HOST:-mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-gresspay}
      DB_USER: ${DB_USER:-gresspay}
      DB_PASS: ${DB_PASS:?Set DB_PASS in the environment}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY in the environment}
      GRESSPAY_CRYPTO_ALLOWED: ${GRESSPAY_CRYPTO_ALLOWED:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://your-subdomain.example}
      APP_URL: ${APP_URL:-https://api.your-subdomain.example}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://your-subdomain.example}
      BINANCE_PAY_API_BASE: ${BINANCE_PAY_API_BASE:-https://bpay.binanceapi.com}
      TRON_API_BASE: ${TRON_API_BASE:-https://api.trongrid.io}
      TRON_API_KEY: ${TRON_API_KEY:-}
      USDT_TRC20_CONTRACT: ${USDT_TRC20_CONTRACT:-TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t}
      USDT_CONFIRMATIONS: ${USDT_CONFIRMATIONS:-20}
      WEBHOOK_MAX_RETRIES: ${WEBHOOK_MAX_RETRIES:-5}
      WEBHOOK_TIMEOUT_SECONDS: ${WEBHOOK_TIMEOUT_SECONDS:-8}
    depends_on:
      - mariadb
    restart: unless-stopped

  webhook-worker:
    build: .
    command: ["webhook-worker"]
    environment:
      APP_ENV: production
      DB_DRIVER: ${DB_DRIVER:-mysql}
      DB_HOST: ${DB_HOST:-mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-gresspay}
      DB_USER: ${DB_USER:-gresspay}
      DB_PASS: ${DB_PASS:?Set DB_PASS in the environment}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY in the environment}
      WEBHOOK_MAX_RETRIES: ${WEBHOOK_MAX_RETRIES:-5}
      WEBHOOK_TIMEOUT_SECONDS: ${WEBHOOK_TIMEOUT_SECONDS:-8}
      WEBHOOK_WORKER_POLL_SECONDS: ${WEBHOOK_WORKER_POLL_SECONDS:-5}
    depends_on:
      - mariadb
      - php
    restart: unless-stopped

  mariadb:
    image: mariadb:11
    environment:
      MYSQL_DATABASE: gresspay
      MYSQL_USER: gresspay
      MYSQL_PASSWORD: ${DB_PASS:?Set DB_PASS in the environment}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the environment}
    volumes:
      - gresspay_db:/var/lib/mysql
      - ./schema/install.mysql.sql:/docker-entrypoint-initdb.d/01-install.sql:ro
    restart: unless-stopped

volumes:
  gresspay_db:
