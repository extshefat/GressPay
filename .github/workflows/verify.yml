name: Verify

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web:
    name: Next.js tsc + live build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci || npm install
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_DATA_SOURCE: live

  php:
    name: PHP unit tests
    runs-on: ubuntu-latest
    container:
      image: php:8.2-cli-alpine
    steps:
      - uses: actions/checkout@v4
      - name: Install extensions
        run: |
          apk add --no-cache $PHPIZE_DEPS icu-dev curl-dev
          docker-php-ext-install bcmath
      - name: Run tests
        run: php backend/tests/run.php

  android:
    name: Android unit tests + APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GressPay-App-Project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$HOME/android-sdk}"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest --tests com.gresspay.companion.sms.PaymentSmsParserTest --stacktrace
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Upload companion APK
        uses: actions/upload-artifact@v4
        with:
          name: gresspay-companion-debug
          path: GressPay-App-Project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
