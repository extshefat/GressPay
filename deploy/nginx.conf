# Edge nginx: all browser API requests go through Next; internal API is nginx/FPM on :8080.
upstream gresspay_web {
    server web:3000;
}

upstream gresspay_api {
    server php:8080;
}

server {
    listen 80;
    server_name your-subdomain.example;
    client_max_body_size 8m;

    # Browser /api/* must hit Next (session cookie + /api/v1 Bearer inject).
    # Next proxies to PHP via GRESSPAY_PHP_URL — do not send /api/auth or
    # browser /api/v1 straight to the PHP upstream or dashboard login loops.
    location /api/ {
        proxy_pass http://gresspay_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-GressPay-Client-IP "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://gresspay_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-GressPay-Client-IP "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
