# ==============================================================================
# GressPay All-In-One Unified Docker Compose Stack for Coolify VPS
# Runs Frontend (Next.js) + Backend (PHP API) + Database (MariaDB) together
# ==============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      NEXT_PUBLIC_APP_NAME: GressPay
      NEXT_PUBLIC_APP_URL: ${APP_URL:-https://your-domain.com}
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_DATA_SOURCE: live
      GRESSPAY_PHP_URL: "http://php:8080"
    ports:
      - "3000"
    restart: unless-stopped
    depends_on:
      - php

  php:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_NAME: GressPay
      APP_ENV: production
      APP_URL: ${APP_URL:-https://your-domain.com}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://your-domain.com}
      DB_DRIVER: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: gresspay
      DB_USER: gresspay
      DB_PASS: ${DB_PASS:-gp_db_secure_pass_2026}
      JWT_SECRET: ${JWT_SECRET:-gresspay_jwt_secret_must_be_32_chars_min}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-gresspay_enc_key_must_be_32_chars_min}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      GRESSPAY_CRYPTO_ALLOWED: ${GRESSPAY_CRYPTO_ALLOWED:-0}
      BINANCE_PAY_API_BASE: ${BINANCE_PAY_API_BASE:-https://bpay.binanceapi.com}
      TRON_API_BASE: ${TRON_API_BASE:-https://api.trongrid.io}
      TRON_API_KEY: ${TRON_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      PORT: "8080"
    depends_on:
      - mariadb
    restart: unless-stopped

  mariadb:
    image: mariadb:11
    environment:
      MYSQL_DATABASE: gresspay
      MYSQL_USER: gresspay
      MYSQL_PASSWORD: ${DB_PASS:-gp_db_secure_pass_2026}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gp_root_pass_2026}
    volumes:
      - gresspay_db:/var/lib/mysql
      - ./backend/schema/install.mysql.sql:/docker-entrypoint-initdb.d/01-install.sql:ro
    restart: unless-stopped

volumes:
  gresspay_db:
