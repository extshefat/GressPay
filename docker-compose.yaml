# ==============================================================================
# GressPay All-In-One Unified Docker Compose Stack for Coolify VPS
# Frontend (Next.js) + Backend (PHP API). Database driver is set by Coolify via DB_DRIVER
# (typically mysql/mariadb; pgsql/sqlite also supported by the PHP backend when configured).
# Duplicate of docker-compose.yaml for Coolify file-name convenience — keep both in sync.
# ==============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${APP_URL:-https://gresspay.extxcheats.com}
        R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
    environment:
      APP_URL: ${APP_URL}
      NEXT_PUBLIC_APP_URL: ${APP_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      GRESSPAY_PHP_URL: ${GRESSPAY_PHP_URL:-http://php:8080}
      PORT: "3000"
      TRUSTED_PROXY_HOPS: ${WEB_TRUSTED_PROXY_HOPS:-0}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    ports:
      - "3000"
    restart: unless-stopped
    depends_on:
      - php

  php:
    volumes:
      - api-storage:/var/www/gresspay-api/storage
    build:
      context: ./backend
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/api/v1/health') === false ? 1 : 0);"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    environment: &php_environment
      PORT: "8080"
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      TRUSTED_NEXT_PROXIES: ${TRUSTED_NEXT_PROXIES:-}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-tls}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      APP_ENV: production
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-${APP_URL}}
      GRESSPAY_CRYPTO_ALLOWED: ${GRESSPAY_CRYPTO_ALLOWED:-0}
      GRESSPAY_SMS_AUTO_ALLOWED: ${GRESSPAY_SMS_AUTO_ALLOWED:-0}
      APP_URL: ${APP_URL}
      DB_DRIVER: ${DB_DRIVER}
      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASS: ${DB_PASS}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: ${DB_SSLMODE}
      JWT_SECRET: ${JWT_SECRET}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      CORS_ORIGINS: ${CORS_ORIGINS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL}
    restart: unless-stopped

  webhook-worker:
    volumes:
      - api-storage:/var/www/gresspay-api/storage
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["php", "jobs/WebhookWorker.php"]
    environment: *php_environment
    restart: unless-stopped
    depends_on:
      - php

volumes:
  api-storage:
