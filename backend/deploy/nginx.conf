# GressPay API — Nginx on the owner's VPS / subdomain.
# Point the subdomain A record here, then: certbot --nginx -d api.your-subdomain.example

server {
    listen 80;
    server_name api.your-subdomain.example;

    root /var/www/gresspay-api/public;
    index index.php;

    client_max_body_size 8m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php:9000;
        fastcgi_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
    }
}
