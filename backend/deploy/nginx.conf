# GressPay API — Nginx on the owner's VPS / subdomain (optional edge).
# Preferred Coolify path: API image already runs nginx→php-fpm on :8080.
# Point the subdomain A record here, then: certbot --nginx -d api.your-subdomain.example

server {
    listen 80;
    server_name api.your-subdomain.example;

    root /var/www/gresspay-api/public;
    index index.php;

    client_max_body_size 8m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # When using split nginx+php containers, point at the php-fpm service.
        # All-in-one API image uses 127.0.0.1:9000 via nginx.docker.conf instead.
        fastcgi_pass php:9000;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\. {
        deny all;
    }
}
