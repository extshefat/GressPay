# ==============================================================================
# GressPay All-In-One Unified Docker Compose Stack for Coolify VPS
# Runs Frontend (Next.js) + Backend (PHP API) + Database (MariaDB) together
# ==============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      NEXT_PUBLIC_APP_NAME: GressPay
      NEXT_PUBLIC_APP_URL: ${APP_URL:-https://gresspay.extxcheats.com}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_DATA_SOURCE: live
      GRESSPAY_PHP_URL: "http://php:8080"
    ports:
      - "3000"
    restart: unless-stopped
    depends_on:
      - php

  php:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_NAME: GressPay
      APP_ENV: production
      APP_URL: ${APP_URL:-https://gresspay.extxcheats.com}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://gresspay.extxcheats.com}
      DB_DRIVER: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_DATABASE:-gresspay}
      DB_USER: ${DB_USERNAME:-gresspay}
      DB_PASS: ${DB_PASSWORD:-${DB_PASS:?Set DB_PASS or DB_PASSWORD}}
      DB_DATABASE: ${DB_DATABASE:-gresspay}
      DB_USERNAME: ${DB_USERNAME:-gresspay}
      DB_PASSWORD: ${DB_PASSWORD:-${DB_PASS:?Set DB_PASS or DB_PASSWORD}}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://gresspay.extxcheats.com}
      GRESSPAY_CRYPTO_ALLOWED: ${GRESSPAY_CRYPTO_ALLOWED:-0}
      BINANCE_PAY_API_BASE: ${BINANCE_PAY_API_BASE:-https://bpay.binanceapi.com}
      TRON_API_BASE: ${TRON_API_BASE:-https://api.trongrid.io}
      TRON_API_KEY: ${TRON_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      PORT: "8080"
    depends_on:
      - mariadb
    restart: unless-stopped

  mariadb:
    image: mariadb:11
    environment:
      MYSQL_DATABASE: gresspay
      MYSQL_USER: gresspay
      MYSQL_PASSWORD: ${DB_PASSWORD:-${DB_PASS:?Set DB_PASS or DB_PASSWORD}}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - gresspay_db:/var/lib/mysql
      - ./backend/schema/install.mysql.sql:/docker-entrypoint-initdb.d/01-install.sql:ro
    restart: unless-stopped

volumes:
  gresspay_db:
