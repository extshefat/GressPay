name: Verify

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  postgres:
    name: PostgreSQL reconciliation
    runs-on: ubuntu-latest
    container: php:8.2-cli-alpine
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gresspay_test
          POSTGRES_USER: gresspay
          POSTGRES_PASSWORD: ci-only-test-password
        options: >-
          --health-cmd "pg_isready -U gresspay -d gresspay_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_ENV: development
      DB_DRIVER: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: gresspay_test
      DB_USER: gresspay
      DB_PASS: ci-only-test-password
      JWT_SECRET: ci-test-jwt-secret-at-least-32-characters
      APP_ENCRYPTION_KEY: ci-test-encryption-key-at-least-32-characters
      GRESSPAY_SMS_AUTO_ALLOWED: '0'
    steps:
      - uses: actions/checkout@v4
      - run: apk add --no-cache postgresql-dev $PHPIZE_DEPS && docker-php-ext-install pdo_pgsql bcmath
      - run: php backend/tests/postgres.php

  mysql:
    name: MySQL security migrations and upserts
    runs-on: ubuntu-latest
    container: php:8.2-cli-alpine
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: gresspay_test
          MYSQL_USER: gresspay
          MYSQL_PASSWORD: ci-test-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pci-root-password"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: development
      DB_DRIVER: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: gresspay_test
      DB_USER: gresspay
      DB_PASS: ci-test-password
      JWT_SECRET: ci-test-jwt-secret-at-least-32-characters
      APP_ENCRYPTION_KEY: ci-test-encryption-key-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - run: docker-php-ext-install pdo_mysql bcmath
      - run: php backend/tests/mysql.php

  api-container:
    name: Non-root API boot and Google OAuth start
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the production API image
        run: docker build --tag gresspay-api-ci ./backend
      - name: Boot with Coolify's shared web port
        run: |
          docker run --detach --name gresspay-api-ci \
            --publish 127.0.0.1:18080:8080 \
            --env APP_ENV=production --env DB_DRIVER=sqlite \
            --env SQLITE_PATH=/tmp/php/ci.sqlite \
            --env JWT_SECRET=ci-only-jwt-secret-at-least-32-characters \
            --env APP_ENCRYPTION_KEY=ci-only-encryption-key-at-least-32-characters \
            --env GOOGLE_CLIENT_ID=ci-client.apps.googleusercontent.com \
            --env GOOGLE_CLIENT_SECRET=ci-only-google-secret \
            --env APP_URL=https://gresspay.example \
            --env API_PORT=8080 --env PORT=3000 \
            gresspay-api-ci
          ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:18080/api/v1/health > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          test "$(docker exec gresspay-api-ci id -u)" -ne 0
      - name: Check OAuth state storage and environment propagation
        run: |
          curl --fail --silent --show-error --max-time 8 \
            'http://127.0.0.1:18080/api/v1/auth/google/url?redirect_uri=https%3A%2F%2Fgresspay.example%2Fcallback%2Fgoogle' \
            > /tmp/gresspay-oauth-start.json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const response = JSON.parse(readFileSync('/tmp/gresspay-oauth-start.json', 'utf8'));
          assert.equal(response.enabled, true);
          const destination = new URL(response.url);
          assert.equal(destination.origin, 'https://accounts.google.com');
          assert.equal(destination.searchParams.get('client_id'), 'ci-client.apps.googleusercontent.com');
          assert.equal(destination.searchParams.get('redirect_uri'), 'https://gresspay.example/callback/google');
          assert.equal(destination.searchParams.get('code_challenge_method'), 'S256');
          assert.ok(destination.searchParams.get('state'));
          assert.ok(destination.searchParams.get('nonce'));
          console.log('PASS non-root API boot, fixed API port, FPM environment and Google state/PKCE');
          JS
      - name: Show API startup logs
        if: always()
        run: docker logs gresspay-api-ci || true
      - name: Remove the isolated CI container
        if: always()
        run: docker rm --force gresspay-api-ci || true

  web:
    name: Next.js tsc + live build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Compose variants match
        run: cmp docker-compose.yml docker-compose.yaml
      - name: Check for merge conflict markers
        run: |
          if grep -rnE '<<<<<<< |>>>>>>> ' src/ backend/ --include='*.php' --include='*.ts' --include='*.tsx'; then
            echo "ERROR: Merge conflict markers found"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:design
      - run: npm run check:checkout
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_DATA_SOURCE: live
      - name: Checkout flow and responsive browser regressions
        run: |
          set -eu
          npm run start -- --hostname 127.0.0.1 --port 3200 > /tmp/gresspay-checkout-server.log 2>&1 &
          checkout_pid=$!
          google-chrome --headless --no-sandbox --disable-dev-shm-usage \
            --remote-debugging-port=9223 --user-data-dir="$RUNNER_TEMP/gresspay-checkout-chrome" \
            about:blank > /tmp/gresspay-checkout-chrome.log 2>&1 &
          browser_pid=$!
          trap 'kill "$checkout_pid" "$browser_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3200/api/auth/session > /dev/null && curl -fsS http://127.0.0.1:9223/json/version > /dev/null; then break; fi
            sleep 1
          done
          CHECKOUT_QA_BASE=http://127.0.0.1:3200 \
          CHECKOUT_QA_CDP=http://127.0.0.1:9223/json \
          CHECKOUT_QA_ARTIFACTS="$RUNNER_TEMP/gresspay-checkout-review" \
            node scripts/check-checkout-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkout-flow-review
          path: ${{ runner.temp }}/gresspay-checkout-review
          if-no-files-found: ignore
      - name: Web security regression checks
        run: |
          set -eu
          GRESSPAY_PHP_URL=http://127.0.0.1:3101 TRUSTED_PROXY_HOPS=1 npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/gresspay-security-web.log 2>&1 &
          security_pid=$!
          trap 'kill "$security_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:3100/api/auth/session > /dev/null && break || sleep 1; done
          curl -fsS http://127.0.0.1:3100/api/auth/session > /dev/null
          node scripts/check-security-web.mjs
          node scripts/check-design-access.mjs
      - name: Capture checkout preview on desktop and mobile
        run: |
          npm run start > /tmp/gresspay-preview.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://localhost:3000/checkout-preview > /dev/null && break || sleep 1; done
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=5000 --screenshot=checkout-desktop.png --window-size=1440,1100 http://localhost:3000/checkout-preview
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=5000 --screenshot=checkout-mobile.png --window-size=390,1000 http://localhost:3000/checkout-preview
      - uses: actions/upload-artifact@v4
        with:
          name: checkout-previews
          path: checkout-*.png

  php:
    name: PHP unit tests
    runs-on: ubuntu-latest
    container:
      image: php:8.2-cli-alpine
    steps:
      - uses: actions/checkout@v4
      - name: Check for merge conflict markers
        run: |
          if grep -rnE '<<<<<<< |>>>>>>> ' src/ backend/ --include='*.php' --include='*.ts' --include='*.tsx'; then
            echo "ERROR: Merge conflict markers found"
            exit 1
          fi
      - name: Install extensions
        run: |
          apk add --no-cache $PHPIZE_DEPS icu-dev curl-dev libpng-dev libjpeg-turbo-dev libwebp-dev
          docker-php-ext-configure gd --with-jpeg --with-webp
          docker-php-ext-install bcmath gd
      - name: Run tests
        run: |
          find backend -name '*.php' -print0 | xargs -0 -n1 php -l
          php backend/tests/run.php

  api-runtime:
    name: Non-root FPM runtime smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gresspay-api-ci ./backend
      - name: Check HTTP API and worker startup
        run: |
          set -eu
          docker run -d --name gp-api-ci -p 127.0.0.1:18080:8080 -e APP_ENV=development -e DB_DRIVER=sqlite gresspay-api-ci
          trap 'docker logs gp-api-ci; docker rm -f gp-api-ci gp-worker-ci 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/api/v1/health > /tmp/gp-health.json && break || sleep 1; done
          curl -fsS http://127.0.0.1:18080/api/v1/health > /tmp/gp-health.json
          python3 -c 'import json; h=json.load(open("/tmp/gp-health.json")); assert h["ok"] and h["database"]["ok"]'
          test "$(docker exec gp-api-ci id -u)" != 0
          docker top gp-api-ci | grep '[p]hp-fpm'
          docker top gp-api-ci | grep '[n]ginx'
          docker run -d --name gp-worker-ci -e APP_ENV=development -e DB_DRIVER=sqlite gresspay-api-ci php jobs/WebhookWorker.php
          for attempt in $(seq 1 10); do docker logs gp-worker-ci 2>&1 | grep -F '[WebhookWorker] started' && break || sleep 1; done
          docker logs gp-worker-ci 2>&1 | grep -F '[WebhookWorker] started'

  android:
    name: Android unit tests + APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GressPay-App-Project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$HOME/android-sdk}"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          SM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Rename debug APK
        run: |
          set -euo pipefail
          OUT="app/build/outputs/apk/debug"
          SRC="$(ls "$OUT"/*.apk | head -n1)"
          cp "$SRC" "$OUT/gresspay-debug.apk"
      - name: Upload GressPay debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gresspay-debug
          path: GressPay-App-Project/app/build/outputs/apk/debug/gresspay-debug.apk
          if-no-files-found: warn
      - name: Assemble release (when keystore secrets present)
        env:
          GRESSPAY_RELEASE_KEYSTORE_BASE64: ${{ secrets.GRESSPAY_RELEASE_KEYSTORE_BASE64 }}
          GRESSPAY_RELEASE_STORE_PASSWORD: ${{ secrets.GRESSPAY_RELEASE_STORE_PASSWORD }}
          GRESSPAY_RELEASE_KEY_ALIAS: ${{ secrets.GRESSPAY_RELEASE_KEY_ALIAS }}
          GRESSPAY_RELEASE_KEY_PASSWORD: ${{ secrets.GRESSPAY_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${GRESSPAY_RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "No GRESSPAY_RELEASE_KEYSTORE_BASE64 secret — skipping release APK (debug artifact still uploaded)."
            echo "Set keystore + password secrets to publish a release-signed gresspay.apk with R8."
            exit 0
          fi
          echo "$GRESSPAY_RELEASE_KEYSTORE_BASE64" | base64 -d > /tmp/gresspay-release.jks
          export GRESSPAY_RELEASE_KEYSTORE=/tmp/gresspay-release.jks
          ./gradlew :app:assembleRelease --stacktrace
          OUT="app/build/outputs/apk/release"
          SRC="$(ls "$OUT"/*.apk | head -n1)"
          cp "$SRC" "$OUT/gresspay.apk"
          mkdir -p ../public/download
          cp "$OUT/gresspay.apk" ../public/download/gresspay.apk
          SHA="$(sha256sum "$OUT/gresspay.apk" | awk '{print tolower($1)}')"
          SIZE="$(stat -c%s "$OUT/gresspay.apk")"
          echo "Release APK SHA-256=$SHA size=$SIZE"
          echo "Update src/lib/marketing/companion-download.ts version/sha/size to match this artifact before shipping."
      - name: Upload GressPay release APK
        uses: actions/upload-artifact@v4
        with:
          name: gresspay-release
          path: GressPay-App-Project/app/build/outputs/apk/release/gresspay.apk
          if-no-files-found: ignore
