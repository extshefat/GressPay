# GressPay on one VPS subdomain: frontend + backend together.
# Do not treat a local compose stack as the product.

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/gresspay-api
    depends_on:
      - web
      - php
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      NEXT_PUBLIC_APP_NAME: GressPay
      NEXT_PUBLIC_APP_URL: ${APP_URL:-https://your-subdomain.example}
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_DATA_SOURCE: live
    restart: unless-stopped

  php:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_NAME: GressPay
      APP_ENV: production
      APP_URL: ${APP_URL:-https://your-subdomain.example}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://your-subdomain.example}
      DB_DRIVER: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: gresspay
      DB_USER: gresspay
      DB_PASS: ${DB_PASS:?Set DB_PASS}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://your-subdomain.example}
      GRESSPAY_CRYPTO_ALLOWED: ${GRESSPAY_CRYPTO_ALLOWED:-0}
      BINANCE_PAY_API_BASE: ${BINANCE_PAY_API_BASE:-https://bpay.binanceapi.com}
      TRON_API_BASE: ${TRON_API_BASE:-https://api.trongrid.io}
      TRON_API_KEY: ${TRON_API_KEY:-}
      PORT: "8080"
    depends_on:
      - mariadb
    restart: unless-stopped

  mariadb:
    image: mariadb:11
    environment:
      MYSQL_DATABASE: gresspay
      MYSQL_USER: gresspay
      MYSQL_PASSWORD: ${DB_PASS:?Set DB_PASS}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - gresspay_db:/var/lib/mysql
      - ./backend/schema/install.mysql.sql:/docker-entrypoint-initdb.d/01-install.sql:ro
    restart: unless-stopped

volumes:
  gresspay_db:
